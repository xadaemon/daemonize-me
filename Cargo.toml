[package]
name = "daemonize-me"
version = "3.0.0-alpha4"
authors = ["Matheus Xavier <mxavier@boxtheta.eu>"]
edition = "2021"
license = "BSD-3-Clause/Apache-2.0"
repository = "https://github.com/xadaemon/daemonize-me"
description = "Rust library to ease the task of creating daemons on unix-like systems"
readme = "README.md"
keywords = ["daemon", "daemonize", "daemonize-me", "unix"]
categories = ["os::unix-apis"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2.186"
nix = {version =  "0.31.3", features = ["process", "user", "fs"]}
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "time"] }
